document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

margin: 0 0 8px; color: #17182c;\">{{ h.title }}<\u002Fh4>\n              <p style=\"margin: 0; font-size: 13.5px; line-height: 1.55; color: #5c628a;\">{{ h.desc }}<\u002Fp>\n              <sc-for list=\"{{ h.links }}\" as=\"lnk\" hint-placeholder-count=\"0\">\n                <a href=\"{{ lnk.url }}\" target=\"_blank\" style=\"display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #17182c; background: rgba(20,22,50,0.05); border: 1px solid rgba(20,22,50,0.10);\">◎ {{ lnk.handle }}<\u002Fa>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- CONTACT -->\n    <section id=\"contact\" style=\"scroll-margin-top: 90px; padding: 70px 0 110px;\">\n      <div data-reveal=\"\" style=\"position: relative; overflow: hidden; padding: 64px 48px; border-radius: 32px; background: linear-gradient(135deg, rgba(255,92,106,0.14), rgba(139,123,255,0.14)); border: 1px solid rgba(20,22,50,0.10); text-align: center;\">\n        <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(20,22,50,0.05) 1.4px, transparent 1.4px); background-size: 26px 26px; opacity: 0.6;\"><\u002Fdiv>\n        <div style=\"position: relative;\">\n          <h2 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 58px); line-height: 1.04; letter-spacing: -0.025em; margin: 0 0 14px; color: #17182c;\">Let's play and create more<br><span style=\"background: linear-gradient(120deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent;\">amazing games together<\u002Fspan><\u002Fh2>\n          <p style=\"margin: 0 0 34px; font-size: 17px; color: #454a6b;\">I'm currently open to Lead / Senior UX design opportunities.<\u002Fp>\n          <div style=\"display: flex; gap: 14px; justify-content: cente =\"position: relative; height: 210px; background: {{ activeProject.cover }};\">\n          <div style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.14) 1.4px, transparent 1.4px); background-size: 22px 22px; opacity: 0.6;\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 26px; top: 24px; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #17182c; background: rgba(255,255,255,0.92);\">{{ activeProject.tag }}<\u002Fdiv>\n          <span style=\"position: absolute; right: 24px; bottom: 20px; font-size: 60px;\">{{ activeProject.emoji }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ closeProject }}\" style=\"position: absolute; right: 20px; top: 20px; width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; background: rgba(23,24,44,0.55); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px);\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding: 30px 34px 38px;\">\n          <h2 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; margin: 0 0 14px; color: #17182c;\">{{ activeProject.title }}<\u002Fh2>\n          <p style=\"margin: 0 0 26px; font-size: 16px; line-height: 1.66; color: #3f4465;\">{{ activeProject.desc }}<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px;\">\n            <sc-for list=\"{{ activeProject.metrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"padding: 18px; border-radius: 16px; background: rgba(20,22,50,0.04); border: 1px solid rgba(20,22,50,0.08);\">\n                <div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; color: var(--mint);\">{{ m.value }}<\u002Fdiv>\n                <div style=\"font-size: 12.5px; color: #5c628a; margin-top: 4px;\">{{ m.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ activeProject.sections }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom: 22px;\">\n              <h4 style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px;\">{{ s.heading }}<\u002Fh4>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.64; color: #3f4465;\">{{ s.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ activeProject.link }}\">\n            <a href=\"{{ activeProject.link }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top: 24px; display: inline-flex; align-items: center; gap: 9px; padding: 14px 24px; border-radius: 999px; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 10px 24px rgba(255,92,106,0.32);\">Read the full case study on Medium →<\u002Fa>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top: 24px; height: 220px; border-radius: 16px; background: repeating-linear-gradient(135deg, rgba(20,22,50,0.03), rgba(20,22,50,0.03) 12px, rgba(20,22,50,0.015) 12px, rgba(20,22,50,0.015) 24px); border: 1px dashed rgba(20,22,50,0.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #9297b5;\">\n            <span style=\"font-size: 30px;\">🖼️<\u002Fspan>\n            <span style=\"font-size: 13.5px;\">Case study visuals — placeholder<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff5c6a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;accent2&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8b7bff&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showFrameworks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: null };\n\n  componentDidMount() {\n    // apply accent tweaks\n    const root = document.documentElement;\n    if (this.props.accent) root.style.setProperty('--accent', this.props.accent);\n    if (this.props.accent2) root.style.setProperty('--accent2', this.props.accent2);\n\n    const reduce = !!this.props.reduceMotion;\n\n    // scroll reveal\n    const reveals = Array.from(document.querySelectorAll('[data-reveal]'));\n    const reveal = (el) => { el.dataset.shown = '1'; el.style.opacity = '1'; el.style.transform = 'none'; };\n    // re-hide only elements not already revealed (guards against double mount re-hiding shown items)\n    reveals.forEach(el => {\n      if (el.dataset.shown === '1') { reveal(el); return; }\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(26px)';\n      el.style.transition = 'opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1)';\n    });\n    if (reduce) {\n      reveals.forEach(reveal);\n      document.querySelectorAll('[data-float],[data-float2] > div').forEach(el => { el.style.animation = 'none'; });\n    } else {\n      const check = () => {\n        const vh = window.innerHeight || document.documentElement.clientHeight;\n        reveals.forEach(el => {\n          if (el.dataset.shown) return;\n          const r = el.getBoundingClientRect();\n          if (r.top < vh * 0.92 && r.bottom > 0) {\n            const sibs = reveals.filter(s => s.parentElement === el.parentElement && !s.dataset.shown);\n            el.style.transitionDelay = Math.max(0, sibs.indexOf(el)) * 65 + 'ms';\n            reveal(el);\n          }\n        });\n      };\n      window.addEventListener('scroll', check, { passive: true });\n      window.addEventListener('resize', check);\n      this._checkReveal = check;\n      check();\n      requestAnimationFrame(check);\n      setTimeout(check, 120);\n      if (document.fonts && document.fonts.ready) document.fonts.ready.then(check);\n      // fallback cascade (covers environments where scroll events don't reach this frame)\n      const cascade = () => {\n        const next = reveals.filter(el => !el.dataset.shown);\n        if (!next.length) return;\n        reveal(next[0]);\n        setTimeout(cascade, 55);\n      };\n      setTimeout(cascade, 450);\n    }\n\n    // active nav highlight\n    const navLinks = Array.from(document.querySelectorAll('[data-nav]'));\n    const setActive = (id) => {\n      navLinks.forEach(a => {\n        const on = a.getAttribute('data-nav') === id;\n        a.style.color = on ? '#17182c' : '#5c628a';\n        a.style.background = on ? 'rgba(20,22,50,0.06)' : 'transparent';\n      });\n    };\n    const sections = ['story','journey','skills','work','frameworks','contact']\n      .map(id => document.getElementById(id)).filter(Boolean);\n    const navIo = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });\n    }, { rootMargin: '-45% 0px -50% 0px' });\n    sections.forEach(s => navIo.observe(s));\n\n    // card hover micro-interaction\n    document.querySelectorAll('[data-card]').forEach(card => {\n      const badge = card.querySelector('[data-badge]');\n      card.addEventListener('mouseenter', () => {\n        card.style.transform = 'translateY(-8px)';\n        card.style.boxShadow = '0 26px 60px rgba(20,22,50,0.16)';\n        card.style.borderColor = 'rgba(20,22,50,0.16)';\n        if (badge) badge.style.transform = 'scale(1.18) rotate(-8deg)';\n      });\n      card.addEventListener('mouseleave', () => {\n        card.style.transform = 'translateY(0)';\n        card.style.boxShadow = '0 8px 26px rgba(20,22,50,0.06)';\n        card.style.borderColor = 'rgba(20,22,50,0.08)';\n        if (badge) badge.style.transform = 'none';\n      });\n    });\n\n    // esc to close modal\n    this._onKey = (e) => { if (e.key === 'Escape') this.setState({ active: null }); };\n    window.addEventListener('keydown', this._onKey);\n  }\n\n  componentWillUnmount() {\n    if (this._onKey) window.removeEventListener('keydown', this._onKey);\n  }\n\n  renderVals() {\n    const P = [\n      {\n        tag: 'LiveOps · Events',\n        title: 'Daily / Weekly Collectibles',\n        emoji: '🗓️',\n        cover: 'linear-gradient(140deg, #ff7a5c, #ff5c8a)',\n        desc: 'Designed reusable engagement frameworks for timed events and seasonal quests — reduced UI and animation effort by 30+ hours per cycle while enabling rapid reuse across multiple LiveOps events.',\n        stat: '−30+ hrs / cycle',\n        metrics: [\n          { value: '30+', label: 'Hours saved per cycle' },\n          { value: 'Multi', label: 'Reusable event frameworks' },\n          { value: '↑', label: 'Faster LiveOps turnaround' },\n        ],\n        sections: [\n          { heading: 'The Challenge', body: 'Every timed event was being designed and animated from scratch, burning production hours and creating inconsistent player experiences across seasonal quests.' },\n          { heading: 'Approach', body: 'Built a modular, reusable engagement framework for collectibles — a system of components and animation patterns that teams could recombine for any daily or weekly event.' },\n          { heading: 'Impact', body: 'Cut UI and animation effort by 30+ hours per cycle and enabled rapid reuse across multiple LiveOps events without sacrificing polish.' },\n        ],\n      },\n      {\n        tag: 'Game UX Design',\n        title: 'Hexa Tap Away',\n        emoji: '🎯',\n        cover: 'linear-gradient(140deg, #8b7bff, #46e5b0)',\n        comingSoon: true,\n        desc: \"Led end-to-end UI/UX direction for PlaySimple's first hybrid-casual game — owning the full player interface and gameplay system UX from scratch.\",\n        stat: '',\n        metrics: [\n          { value: '1st', label: 'Hybrid-casual title' },\n          { value: 'E2E', label: 'UI/UX ownership' },\n          { value: '0→1', label: 'Built from scratch' },\n        ],\n        sections: [\n          { heading: 'Case Study', body: 'Full case study coming soon — this one is still under wraps. Happy to walk through the end-to-end process, gameplay system UX, and interface decisions in a face-to-face conversation.' },\n        ],\n      },\n      {\n        tag: 'In-App Purchase',\n        title: 'Word Trip — IAP System Design',\n        emoji: '🛒',\n        cover: 'linear-gradient(140deg, #46e5b0, #3aa0ff)',\n        desc: 'End-to-end redesign of the in-app store experience for Word Trip, improving purchase conversion. Later ported across multiple word game titles in the company.',\n        stat: '↑ conversion',\n        metrics: [\n          { value: '↑', label: 'Purchase conversion' },\n          { value: 'Multi', label: 'Titles ported to' },\n          { value: 'E2E', label: 'Store redesign' },\n        ],\n        sections: [\n          { heading: 'The Challenge', body: \"Word Trip's in-app store was underperforming on conversion and lacked a scalable structure that other titles could adopt.\" },\n          { heading: 'Approach', body: 'Ran an end-to-end redesign of the store experience — rethinking merchandising, hierarchy, and the purchase flow to make value clearer at the moment of intent.' },\n          { heading: 'Impact', body: 'Improved purchase conversion and proved reusable enough to be ported across multiple word game titles in the company.' },\n        ],\n      },\n      {\n        tag: 'In-App Purchase',\n        title: 'Crossword — Trending Section',\n        emoji: '📈',\n        cover: 'url(https://miro.medium.com/v2/resize:fit:1200/1*4EuiG8jt9-v4juVHAzJLhA.png) center/cover no-repeat, linear-gradient(140deg, #ffce4a, #ff7a5c)',\n        link: 'https://medium.com/@shilparaj47/todays-top-picks-61fa1e2b6de5',\n        desc: \"Designed 'Today's Top Picks' applying mixed-methods research on a 10M+ user base to lift puzzle completion rates and activate 600k daily engaged users.\",\n        stat: '600k daily active',\n        metrics: [\n          { value: '10M+', label: 'User base researched' },\n          { value: '600k', label: 'Daily engaged users activated' },\n          { value: '↑', label: 'Puzzle completion rate' },\n        ],\n        sections: [\n          { heading: 'The Challenge', body: 'Players struggled to discover fresh, relevant puzzles, dampening completion rates across a 10M+ user base.' },\n          { heading: 'Approach', body: \"Applied mixed-methods research to design 'Today's Top Picks' — a trending section surfacing the right puzzles at the right time.\" },\n          { heading: 'Impact', body: 'Lifted puzzle completion rates and activated 600k daily engaged users.' },\n        ],\n      },\n    ];\n\n    const projects = P.map((p, i) => ({\n      ...p,\n      onOpen: () => this.setState({ active: i }),\n    }));\n\n    const activeProject = this.state.active != null ? projects[this.state.active] : null;\n\n    return {\n      projects,\n      activeProject,\n      closeProject: () => this.setState({ active: null }),\n      stop: (e) => e.stopPropagation(),\n      showFrameworks: this.props.showFrameworks !== false,\n      timeline: [\n        { year: '2018', title: 'First Design Role — B2B', desc: 'Began career as a junior UX designer, discovering the intersection of art and problem-solving.' },\n        { year: '2020', title: 'Joined PlaySimple Games', desc: 'Joined as Associate UX Designer — crafting intuitive experiences for mobile word games.' },\n        { year: '2022–24', title: 'Managing & leading multiple games', desc: 'Led UX design for 4 key in-app purchase features, driving monetisation & player delight.' },\n        { year: '2024–26', title: 'Leading multiple genres & building team', desc: 'Growing into a systems thinker — leading design decisions across the full product lifecycle.' },\n      ],\n      skills: [\n        { icon: '🔍', iconBg: 'rgba(255,92,106,0.16)', title: 'UX & Research', items: ['User Research', 'Usability Testing', 'Journey Mapping', 'Wireframing', 'Prototyping'] },\n        { icon: '🎨', iconBg: 'rgba(139,123,255,0.18)', title: 'Visual Design', items: ['UI Design', 'Illustration', 'Design Systems', 'Motion Design', 'Visual Hierarchy'] },\n        { icon: '📱', iconBg: 'rgba(31,180,136,0.16)', title: 'Mobile & Desktop', items: ['Mobile-First Design', 'IAP Flows', 'Casual Game UX', 'A/B Testing', 'Monetisation UX'] },\n        { icon: '🛠️', iconBg: 'rgba(224,164,0,0.18)', title: 'Tools', items: ['Figma', 'Miro', 'AI tools', 'Playtest Cloud'] },\n      ],\n      hobbies: [\n        { icon: '🖌️', title: 'Illustration', desc: 'Creating art is where my design journey began. I still illustrate to explore ideas and keep my instincts sharp.' },\n        { icon: '✈️', title: 'Travel & Food', desc: 'Exploring new cultures fuels my empathy as a designer — every place teaches me how people interact with the world.', links: [{ handle: '@taste_travel_canvas', url: 'https://instagram.com/taste_travel_canvas' }] },\n        { icon: '🎲', title: 'Board Games', desc: 'Weekends are for board games — favourites include Everdell, Creature Comforts, Viticulture and Flamescraft.' },\n        { icon: '🧁', title: 'Baking & Cooking', desc: 'Food knows no boundaries — experimenting in the kitchen is my way of exploring culture and creativity.' },\n      ],\n      frameworks: [\n        { icon: '🔕', glow: 'rgba(255,92,106,0.4)', title: 'Interruption Analysis', desc: 'A non-interruptive UX framework optimising pop-up frequency and cooldown intervals across live games — reducing player drop-off by 1.5%.' },\n        { icon: '🧩', glow: 'rgba(139,123,255,0.4)', title: 'Player Archetypes', desc: 'A scalable player-research framework adopted org-wide, capturing qualitative insights that informed strategic roadmaps for 3+ live titles.' },\n        { icon: '🤖', glow: 'rgba(31,180,136,0.4)', title: 'AI UX Pipeline', desc: 'Spearheaded AI tooling adoption across the design org — integrating generative AI into documentation, ideation and prototyping workflows.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
